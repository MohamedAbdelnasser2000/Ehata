  <circle cx="130" cy="670" r="190" fill="#E2E8F0"/>
  <text x="76" y="94" fill="#0284C7" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">PROJECT ILLUSTRATION</text>
  
  <!-- Main Application Window (Angular SPA) -->
  <rect x="90" y="150" width="560" height="420" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="90" y="150" width="560" height="52" rx="18" fill="#0F172A"/>
  <path d="M90 184h560v18H90z" fill="#0F172A"/>
  <circle cx="124" cy="176" r="7" fill="#EF4444"/>
  <circle cx="148" cy="176" r="7" fill="#F59E0B"/>
  <circle cx="172" cy="176" r="7" fill="#10B981"/>
  <text x="200" y="182" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15" font-weight="600">Enterprise Document Controller — ClientApp</text>
  
  <!-- Left Folder Tree inside app window -->
  <rect x="90" y="202" width="150" height="368" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="105" y="220" width="120" height="24" rx="6" fill="#0284C7"/>
  <text x="120" y="236" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">📁 Construction Docs</text>
  <text x="120" y="265" fill="#475569" font-family="Arial,sans-serif" font-size="11">↳ 📁 Architectural</text>
  <text x="120" y="290" fill="#475569" font-family="Arial,sans-serif" font-size="11">↳ 📁 Structural</text>
  <text x="120" y="315" fill="#475569" font-family="Arial,sans-serif" font-size="11">↳ 📁 Compliance</text>
  <text x="120" y="340" fill="#475569" font-family="Arial,sans-serif" font-size="11">↳ 📁 As-Built Plans</text>
  
  <!-- Document List Table inside app window -->
  <rect x="255" y="215" width="380" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="240" fill="#64748B" font-family="Arial,sans-serif" font-size="12" font-weight="700">DOCUMENT NAME</text>
  <text x="450" y="240" fill="#64748B" font-family="Arial,sans-serif" font-size="12" font-weight="700">VER</text>
  <text x="510" y="240" fill="#64748B" font-family="Arial,sans-serif" font-size="12" font-weight="700">STATUS</text>
  
  <!-- Row 1 -->
  <rect x="255" y="265" width="380" height="45" rx="8" fill="#fff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="292" fill="#0F172A" font-family="Arial,sans-serif" font-size="13" font-weight="600">Site_Blueprint_v3.pdf</text>
  <text x="455" y="292" fill="#0284C7" font-family="Arial,sans-serif" font-size="13" font-weight="700">v3.2</text>
  <rect x="510" y="278" width="65" height="20" rx="10" fill="#DCFCE7"/>
  <text x="522" y="292" fill="#15803D" font-family="Arial,sans-serif" font-size="11" font-weight="700">Approved</text>
  
  <!-- Row 2 -->
  <rect x="255" y="320" width="380" height="45" rx="8" fill="#fff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="347" fill="#0F172A" font-family="Arial,sans-serif" font-size="13" font-weight="600">MEP_Engineering_Final.dwg</text>
  <text x="455" y="347" fill="#0284C7" font-family="Arial,sans-serif" font-size="13" font-weight="700">v2.0</text>
  <rect x="510" y="333" width="75" height="20" rx="10" fill="#FEF3C7"/>
  <text x="520" y="347" fill="#B45309" font-family="Arial,sans-serif" font-size="11" font-weight="700">In Review</text>

  <!-- Row 3 -->
  <rect x="255" y="375" width="380" height="45" rx="8" fill="#fff" stroke="#E2E8F0" stroke-width="1"/>
  <text x="270" y="402" fill="#0F172A" font-family="Arial,sans-serif" font-size="13" font-weight="600">Safety_Audit_Q4.docx</text>
  <text x="455" y="402" fill="#0284C7" font-family="Arial,sans-serif" font-size="13" font-weight="700">v1.1</text>
  <rect x="510" y="388" width="65" height="20" rx="10" fill="#DCFCE7"/>
  <text x="522" y="402" fill="#15803D" font-family="Arial,sans-serif" font-size="11" font-weight="700">Approved</text>
  
  <!-- Bottom Actions -->
  <rect x="255" y="440" width="130" height="35" rx="8" fill="#0284C7"/>
  <text x="278" y="462" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">+ Upload New</text>
  
  <!-- Right Graphic: Cloud Storage & Multi-DB Architecture Motif -->
  <!-- S3 & Azure Cloud Representation -->
  <rect x="740" y="180" width="360" height="360" rx="24" fill="#0F172A"/>
  
  <!-- Central Cloud Icon -->
  <path d="M880 280 a35 35 0 0 1 50 10 a30 30 0 0 1 20 28 a25 25 0 0 1 -15 22 h-80 a25 25 0 0 1 -15 -22 a30 30 0 0 1 10 -25 a35 35 0 0 1 30 -13 z" fill="#0284C7"/>
  <text x="920" y="370" text-anchor="middle" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="16" font-weight="700">Cloud Storage Hub</text>
  
  <!-- Connected Storage Targets -->
  <rect x="770" y="400" width="130" height="55" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
  <text x="835" y="425" text-anchor="middle" fill="#38BDF8" font-family="Arial,sans-serif" font-size="13" font-weight="700">AWS S3</text>
  <text x="835" y="442" text-anchor="middle" fill="#94A3B8" font-family="Arial,sans-serif" font-size="10">Object Archive</text>
  
  <rect x="940" y="400" width="130" height="55" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1005" y="425" text-anchor="middle" fill="#38BDF8" font-family="Arial,sans-serif" font-size="13" font-weight="700">Azure Blob</text>
  <text x="1005" y="442" text-anchor="middle" fill="#94A3B8" font-family="Arial,sans-serif" font-size="10">Cloud Storage</text>
  
  <!-- Dual DB Badges -->
  <rect x="800" y="475" width="100" height="35" rx="8" fill="#334155"/>
  <text x="850" y="497" text-anchor="middle" fill="#E2E8F0" font-family="Arial,sans-serif" font-size="12" font-weight="600">SQL Server</text>
  <rect x="920" y="475" width="100" height="35" rx="8" fill="#334155"/>
  <text x="970" y="497" text-anchor="middle" fill="#E2E8F0" font-family="Arial,sans-serif" font-size="12" font-weight="600">MySQL</text>

  <text x="920" y="640" text-anchor="middle" fill="#64748B" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">REST API · ANGULAR SPA · AWS S3 · AZURE BLOB</text>
</svg>