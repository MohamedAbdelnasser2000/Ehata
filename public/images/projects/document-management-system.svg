<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <title>Document Management System illustration</title>
  <desc>An abstract enterprise document control platform with cloud storage and versioning.</desc>
  <rect width="1200" height="760" rx="32" fill="#F8FAFC"/>
