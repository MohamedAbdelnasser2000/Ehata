<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <title>ParentGuard Child Monitoring Suite illustration</title>
  <desc>An abstract parental monitoring dashboard and paired mobile device illustration.</desc>
  <rect width="1200" height="760" rx="32" fill="#0D1117"/>
  <circle cx="1040" cy="150" r="210" fill="#161B22"/>
  <circle cx="140" cy="670" r="190" fill="#161B22"/>
  <text x="76" y="94" fill="#58A6FF" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">PROJECT ILLUSTRATION</text>
  
  <!-- Desktop App Window (WPF) -->
  <rect x="90" y="150" width="530" height="420" rx="18" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  <rect x="90" y="150" width="530" height="52" rx="18" fill="#0D1117"/>
  <path d="M90 184h530v18H90z" fill="#0D1117"/>
  <circle cx="124" cy="176" r="7" fill="#F85149"/>
  <circle cx="148" cy="176" r="7" fill="#D29922"/>
  <circle cx="172" cy="176" r="7" fill="#3FB950"/>
  <text x="200" y="182" fill="#8B949E" font-family="Arial,sans-serif" font-size="15" font-weight="600">ParentGuard — Parent Dashboard (WPF)</text>
  
  <!-- Left Nav sidebar mockup inside desktop window -->
  <rect x="90" y="202" width="120" height="368" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <rect x="105" y="225" width="90" height="24" rx="6" fill="#1F6FEB"/>
  <rect x="105" y="260" width="90" height="20" rx="6" fill="#21262D"/>
  <rect x="105" y="290" width="90" height="20" rx="6" fill="#21262D"/>
  <rect x="105" y="320" width="90" height="20" rx="6" fill="#21262D"/>
  <rect x="105" y="350" width="90" height="20" rx="6" fill="#21262D"/>
  
  <!-- Main content area inside desktop window -->
  <!-- Status Bar: Encrypted WebSocket Live -->
  <rect x="225" y="220" width="375" height="45" rx="8" fill="#21262D" stroke="#3FB950" stroke-width="1.5"/>
  <circle cx="245" cy="242" r="6" fill="#3FB950"/>
  <text x="260" y="247" fill="#F0F6FC" font-family="Arial,sans-serif" font-size="13" font-weight="700">AES-256-GCM Secure Channel • Connected</text>
  
  <!-- Map / Location Card -->
  <rect x="225" y="280" width="230" height="150" rx="10" fill="#21262D" stroke="#30363D" stroke-width="1"/>
  <path d="M225 350 h230 M340 280 v150" stroke="#30363D" stroke-width="2"/>
  <circle cx="340" cy="350" r="14" fill="#1F6FEB" fill-opacity="0.3"/>
  <circle cx="340" cy="350" r="6" fill="#58A6FF"/>
  <text x="240" y="305" fill="#8B949E" font-family="Arial,sans-serif" font-size="12" font-weight="600">LIVE GEOLOCATION</text>
  
  <!-- Metrics cards -->
  <rect x="470" y="280" width="130" height="70" rx="10" fill="#21262D"/>
  <text x="485" y="305" fill="#8B949E" font-family="Arial,sans-serif" font-size="11">SCREEN TIME</text>
  <text x="485" y="335" fill="#58A6FF" font-family="Arial,sans-serif" font-size="22" font-weight="800">2h 15m</text>
  
  <rect x="470" y="360" width="130" height="70" rx="10" fill="#21262D"/>
  <text x="485" y="385" fill="#8B949E" font-family="Arial,sans-serif" font-size="11">BATTERY</text>
  <text x="485" y="415" fill="#3FB950" font-family="Arial,sans-serif" font-size="22" font-weight="800">88%</text>
  
  <!-- Activity Feed Preview -->
  <rect x="225" y="445" width="375" height="110" rx="10" fill="#21262D"/>
  <rect x="240" y="465" width="200" height="12" rx="4" fill="#30363D"/>
  <rect x="240" y="490" width="280" height="10" rx="4" fill="#30363D"/>
  <rect x="240" y="510" width="240" height="10" rx="4" fill="#30363D"/>
  
  <!-- Right Graphic: Paired Android Phone + QR Code link -->
  <rect x="740" y="190" width="200" height="380" rx="36" fill="#161B22" stroke="#30363D" stroke-width="4"/>
  <!-- Phone screen -->
  <rect x="752" y="215" width="176" height="330" rx="24" fill="#0D1117"/>
  <!-- Camera notch -->
  <circle cx="840" cy="228" r="4" fill="#30363D"/>
  
  <!-- Shield Icon on phone screen -->
  <path d="M840 270 l35 15 v35 c0 30-25 50-35 55 c-10-5-35-25-35-55 v-35 z" fill="#1F6FEB" fill-opacity="0.2" stroke="#58A6FF" stroke-width="3"/>
  <path d="M830 315 l8 8 16-16" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <text x="840" y="400" text-anchor="middle" fill="#F0F6FC" font-family="Arial,sans-serif" font-size="13" font-weight="700">ParentGuard Active</text>
  <text x="840" y="420" text-anchor="middle" fill="#3FB950" font-family="Arial,sans-serif" font-size="11">Consent Verified • Paired</text>
  
  <!-- QR Code mini representation on phone -->
  <rect x="805" y="445" width="70" height="70" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1"/>
  <rect x="815" y="455" width="18" height="18" fill="#58A6FF"/>
  <rect x="847" y="455" width="18" height="18" fill="#58A6FF"/>
  <rect x="815" y="487" width="18" height="18" fill="#58A6FF"/>
  <rect x="847" y="487" width="8" height="8" fill="#58A6FF"/>

  <!-- Connection Wave between Desktop and Phone -->
  <path d="M635 340 c35-30 65-30 90 0" stroke="#58A6FF" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <path d="M635 360 c35-30 65-30 90 0" stroke="#3FB950" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  
  <text x="840" y="640" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">WPF DASHBOARD · ANDROID COMPANION · AES-256</text>
</svg>